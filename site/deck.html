<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nakshatra CHRONOS: slides</title>
<link rel="stylesheet" href="home.css">
<style>
body { background: #101626; color: #e4e8f2; }
.deckbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 18px; align-items: center; padding: 12px clamp(16px, 4vw, 40px); background: rgba(16, 22, 38, .92); border-bottom: 1px solid #27304d; font-family: var(--sans); }
.deckbar a { color: #c3cbdd; }
.deckbar .brand { color: #f1f3f8; }
.deckbar .count { margin-left: auto; color: #9aa4bd; }
.slides { max-width: 1280px; margin: 0 auto; padding: 28px clamp(12px, 3vw, 32px) 80px; display: grid; gap: 28px; }
.s { margin: 0; scroll-margin-top: 70px; }
.s img { width: 100%; height: auto; border-radius: 10px; border: 1px solid #27304d; box-shadow: 0 24px 50px -30px #000; background: #0b1020; }
</style>
</head>
<body>
<header class="deckbar">
  <a class="brand" href="index.html">Nakshatra <b>CHRONOS</b></a>
  <a href="media/CHRONOS_deck.pdf">Download PDF</a>
  <a href="media/Nakshatra_CHRONOS.pptx">Download PowerPoint</a>
  <a href="observatory.html">Open the observatory</a>
  <span class="count" id="count">10 slides, use the arrow keys</span>
</header>
<main class="slides">
    <figure class="s" id="s1"><img src="deck/slide01.jpg" alt="Slide 1: Nakshatra CHRONOS" loading="eager"></figure>
    <figure class="s" id="s2"><img src="deck/slide02.jpg" alt="Slide 2: An unchanged star looks different on every visit" loading="eager"></figure>
    <figure class="s" id="s3"><img src="deck/slide03.jpg" alt="Slide 3: What people do today, and where it breaks" loading="lazy"></figure>
    <figure class="s" id="s4"><img src="deck/slide04.jpg" alt="Slide 4: Compare only fair pairs, then ask five questions of every change" loading="lazy"></figure>
    <figure class="s" id="s5"><img src="deck/slide05.jpg" alt="Slide 5: From photons to a verdict you can check" loading="lazy"></figure>
    <figure class="s" id="s6"><img src="deck/slide06.jpg" alt="Slide 6: The physics, checked by hand, in two languages and on the sky" loading="lazy"></figure>
    <figure class="s" id="s7"><img src="deck/slide07.jpg" alt="Slide 7: A working observatory you can open now" loading="lazy"></figure>
    <figure class="s" id="s8"><img src="deck/slide08.jpg" alt="Slide 8: A hidden truth, 109 unseen fields, and the right to say unknown" loading="lazy"></figure>
    <figure class="s" id="s9"><img src="deck/slide09.jpg" alt="Slide 9: Seven real fields, and a zero that turned into physics" loading="lazy"></figure>
    <figure class="s" id="s10"><img src="deck/slide10.jpg" alt="Slide 10: Every repeat of a hundred million stars needs this check" loading="lazy"></figure>
</main>
<script>
const s = [...document.querySelectorAll(".s")];
let i = 0;
const go = n => { i = Math.max(0, Math.min(s.length - 1, n)); s[i].scrollIntoView({ behavior: "smooth" }); document.getElementById("count").textContent = `Slide ${i + 1} of ${s.length}`; };
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { i = s.indexOf(e.target); document.getElementById("count").textContent = `Slide ${i + 1} of ${s.length}`; } }), { threshold: 0.6 });
s.forEach(x => io.observe(x));
addEventListener("keydown", e => { if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(i + 1); } if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(i - 1); } });
</script>
</body>
</html>
