<!doctype html>
<html lang="en"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRONOS. The fair blink for the SPHEREx sky.</title>
<style>
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic}
:root{--glass:#f5f0e6;--ink:#2e2a33;--soft:#5d5763;--line:#ddd3c2;--panel:#fbf8f2;--fair:#4f6e5f;--warn:#8a6a2e;--bad:#a5523f;
--b1:#8f84c2;--b2:#7d9fd0;--b3:#6fb1ad;--b4:#9cb77a;--b5:#d3ad6a;--b6:#cf8a72;
--read:"EB Garamond",Garamond,"Noto Serif Bengali","Noto Sans Bengali","Hind Siliguri","Nirmala UI",Vrinda,Georgia,serif;
--head:"EB Garamond",Garamond,"Noto Serif Bengali","Noto Sans Bengali",Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--glass);color:var(--ink);font:18px/1.55 var(--read);font-variant-numeric:lining-nums}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1.5px solid var(--ink);padding:.5em 1em;border-radius:2em;cursor:pointer}
button:hover{background:var(--ink);color:#fff}
button.main{background:var(--ink);color:#fff}
button.main:hover{background:#4a4352}
button[aria-pressed=true]{background:var(--ink);color:#fff}
select,input[type=text]{background:var(--panel);border:1.5px solid var(--line);padding:.45em .6em;border-radius:.4em}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.15;margin:0}
p{margin:.5em 0;max-width:68ch}
.top{position:sticky;top:0;z-index:5;display:flex;gap:1em;align-items:center;justify-content:space-between;padding:.45em 1.2em;background:var(--ink);color:#fff}
.top b{font-family:var(--head);font-size:1.15em;letter-spacing:.04em}
.top select{color:var(--ink);padding:.2em .4em}
#stamp{font-size:.85em;padding:.15em .8em;border-radius:2em;background:#fff;color:var(--ink)}
#stamp.real{background:#c9f0dd}#stamp.sim{background:#ffe2a8}
.hero{padding:3.2em 1.2em 1.5em;max-width:1120px;margin:auto}
.hero h1{font-size:clamp(2.2em,6.2vw,4.4em);max-width:13ch}
.hero .rain{display:flex;height:.5em;max-width:27em;margin:1.1em 0 1.3em;border-radius:.3em;overflow:hidden}
.hero .rain i{flex:1}
.hero p{font-size:1.12em}
.hero .aside{color:var(--soft);font-size:1em;border-left:.25em solid var(--b5);padding-left:.9em;margin-top:1.1em}
.stars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7em;margin:1.4em 0 .6em}
.stars button{text-align:left;border-radius:.6em;border-color:var(--line);padding:.8em .9em;display:grid;align-content:start}
.stars button b{font-family:var(--head);font-size:1.15em;display:block}
.stars button span{font-size:.86em;line-height:1.35;display:block;color:var(--soft);margin-top:.2em}
.stars button:hover span,.stars button[aria-pressed=true] span{color:#dfe6ee}
.pick{display:flex;flex-wrap:wrap;gap:.6em;align-items:center;font-size:.95em}
main{max-width:1120px;margin:auto;padding:0 1.2em 4em}
.step{display:grid;grid-template-columns:3.4em 1fr;gap:0 1em;padding:2.2em 0 1.2em;border-top:1.5px solid var(--line);scroll-margin-top:3em}
.step>div{min-width:0}
.step[hidden]{display:none}
.num{font:600 2.6em/1 var(--head);color:var(--soft)}
.step h2{font-size:clamp(1.4em,3.2vw,2em);margin-bottom:.25em}
.box{background:var(--panel);border-radius:.7em;padding:1em;margin-top:.9em}
canvas{display:block;width:100%;background:var(--panel);border-radius:.7em}
#plane{cursor:pointer;margin-top:.9em;touch-action:manipulation}
.key{display:flex;flex-wrap:wrap;gap:.3em 1.1em;font-size:.86em;color:var(--soft);margin-top:.5em}
.key i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.35em;vertical-align:-.05em}
.say{font-size:1.05em;margin-top:.8em;min-height:1.5em}
.verdict{display:flex;flex-wrap:wrap;gap:1.2em;align-items:center}
.verdict .word{font:600 clamp(1.8em,5vw,3em)/1 var(--head)}
.fair .word{color:var(--fair)}.unfair .word{color:var(--bad)}
.score{font-size:.95em;color:var(--soft)}
ul.why{margin:.6em 0 0;padding-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.8em}
.chip{font-size:.86em;padding:.15em .7em;border-radius:2em;border:1.5px solid;background:#fff}
.chip.g{border-color:var(--fair);color:var(--fair)}.chip.a{border-color:var(--warn);color:var(--warn)}.chip.r{border-color:var(--bad);color:var(--bad)}
.meter{margin-top:1em}
.meter h3{font-size:1.15em}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;margin-top:.9em}
.plate{position:relative;background:var(--panel);border-radius:.7em;padding:.5em;margin:0}
.plate .img{position:relative;aspect-ratio:1;overflow:hidden;border-radius:.4em;background:#eef2f4;cursor:crosshair}
.plate img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.plate figcaption{font-size:.86em;color:var(--soft);padding:.4em .2em 0}
.mark{position:absolute;width:1.6em;height:1.6em;margin:-.8em 0 0 -.8em;border:2.5px solid var(--b5);border-radius:50%;pointer-events:none}
.tools{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;margin-top:.8em;font-size:.95em}
.tabs{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.9em}
.result{font:600 1.5em/1.2 var(--head);margin:.2em 0 .4em}
table{border-collapse:collapse;font-size:.9em;margin-top:.6em}
td,th{padding:.2em .8em .2em 0;text-align:left;vertical-align:top}
th{color:var(--soft);font-weight:500}
details{margin-top:2.2em;border-top:1.5px solid var(--line);padding-top:1.2em}
summary{font:600 1.4em var(--head);cursor:pointer}
#labout{white-space:pre-wrap;font-size:.9em;max-height:28em;overflow:auto}
footer{color:var(--soft);font-size:.86em;max-width:1120px;margin:auto;padding:0 1.2em 3em}
@media (max-width:760px){body{font-size:16px}.step{grid-template-columns:1fr}.num{font-size:1.6em}.plates{grid-template-columns:1fr 1fr}.plates .plate:last-child{grid-column:1/3}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<div class="top"><b>CHRONOS</b><span id="stamp" role="status"></span>
<select id="lang" aria-label="Language"><option value="en">English</option><option value="bn">বাংলা</option></select></div>

<header class="hero">
<h1 data-t="h1"></h1>
<div class="rain" aria-hidden="true"><i style="background:var(--b1)"></i><i style="background:var(--b2)"></i><i style="background:var(--b3)"></i><i style="background:var(--b4)"></i><i style="background:var(--b5)"></i><i style="background:var(--b6)"></i></div>
<p data-t="lead1"></p><p data-t="lead2"></p>
<p class="aside" data-t="aside"></p>
<div class="stars" id="stars"></div>
<div class="pick"><label><span data-t="src"></span> <select id="mode"><option value="sim" data-t="sim"></option><option value="live" data-t="live"></option></select></label>
<label id="bandl" hidden><span data-t="band"></span> <select id="det"><option value="-1" data-t="bandauto"></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option value="0" data-t="bandall"></option></select></label>
<label id="rell" hidden><span data-t="rel"></span> <select id="rel"><option value="spherex_qr3+spherex_qr2">QR3 + QR2</option><option value="spherex_qr3">QR3</option><option value="spherex_qr2">QR2</option></select></label>
<button id="tour" data-t="tour"></button></div>
<p class="say" id="loadsay" role="status"></p>
</header>

<main>
<section class="step" id="s1" hidden><div class="num">1</div><div>
<h2 data-t="s1h"></h2><p data-t="s1p"></p>
<canvas id="plane" height="360" tabindex="0" role="img"></canvas>
<div class="key" id="key"></div>
<div class="tools"><button id="best" class="main" data-t="best"></button><span id="picksay" role="status"></span></div>
</div></section>

<section class="step" id="s2" hidden><div class="num">2</div><div>
<h2 data-t="s2h"></h2><p data-t="s2p"></p>
<div class="box"><div class="verdict" id="verdict"><span class="word" id="vword"></span><span class="score" id="vscore"></span></div>
<ul class="why" id="why"></ul><div class="chips" id="chips"></div>
<div class="meter"><h3 data-t="fch"></h3><p id="fcsay"></p><canvas id="fc" height="120" role="img"></canvas></div></div>
</div></section>

<section class="step" id="s3" hidden><div class="num">3</div><div>
<h2 data-t="s3h"></h2><p data-t="s3p"></p>
<div class="plates">
<figure class="plate"><div class="img" id="p1"><img id="ia" alt=""><img id="ia2" alt="" style="opacity:0"></div><figcaption id="c1"></figcaption></figure>
<figure class="plate"><div class="img" id="p2"><img id="ib" alt=""></div><figcaption id="c2"></figcaption></figure>
<figure class="plate"><div class="img" id="p3"><img id="iz" alt=""></div><figcaption data-t="c3"></figcaption></figure></div>
<div class="tools"><button id="blink" aria-pressed="false" data-t="blink"></button>
<label><span data-t="wipe"></span> <input id="wipe" type="range" min="0" max="100" value="0"></label>
<label><input type="checkbox" id="fl"> <span data-t="flags"></span></label></div>
<p class="say" id="witsay" role="status"></p>
</div></section>

<section class="step" id="s4" hidden><div class="num">4</div><div>
<h2 data-t="s4h"></h2><p data-t="s4p"></p>
<div class="tabs" role="tablist"><button id="tmo" role="tab" data-t="tmo"></button><button id="tsp" role="tab" data-t="tsp"></button><button id="tno" role="tab" data-t="tno"></button><button id="trc" role="tab" data-t="trc"></button></div>
<div class="box"><p class="result" id="chk"></p><p id="chksay" role="status"></p><canvas id="plot" height="300" role="img"></canvas><div id="chkmore"></div></div>
</div></section>

<section class="step" id="s5" hidden><div class="num">5</div><div>
<h2 data-t="s5h"></h2><p data-t="s5p"></p>
<div class="box"><p class="result" id="beh"></p><p id="plain"></p></div>
<div class="tools"><button id="dl" class="main" data-t="dl"></button><button id="lk" data-t="lk"></button></div>
</div></section>

<details id="lab"><summary data-t="lab"></summary><p data-t="labp"></p><div class="tools" id="labbar"></div><div class="box"><div id="labout" role="status"></div><div id="labx"></div></div></details>
</main>
<footer><p data-t="foot"></p></footer>

<script>
const $=id=>document.getElementById(id);
const BAND=['#5b3fbf','#2f6fd0','#1a969b','#5f9320','#cf8412','#c4432b'],EDGE=[[.75,1.09],[1.10,1.62],[1.63,2.41],[2.42,3.82],[3.83,4.41],[4.42,5.0]];
const L={en:{

aside:'In Jessore, Radhagobinda Chandra watched stars change with his own eyes and sent tens of thousands of measurements to astronomers across the world. CHRONOS does the same work with a space telescope.',
src:'Data',sim:'Practice sky (works with no internet)',live:'Live SPHEREx archive',band:'Band',bandauto:'Best for this star',bandall:'All bands, fewer pictures',rel:'Release',tour:'Play the full story',
stamp_sim:'Practice sky. Simulated data.',stamp_live:'Real SPHEREx data.',stamp_none:'No data loaded',
s1h:'When did SPHEREx look, and in which color?',s1p:'Each dot is one picture of your star. Left to right is time. Bottom to top is color. Pick a dot. The pictures that match its color light up in green. Those are its fair partners.',
best:'Pick the best fair pair for me',
s2h:'Is this a fair comparison?',s2p:'A fair pair has the same detector, the same color at the star and clean pixels. The meter shows how much false change a color mismatch makes.',

s4h:'How sure are we?',s4p:'Four checks. Each one can fail. That is the point.',

s5h:'The verdict',s5p:'Plain words, made only from the numbers above.',dl:'Download the case file',lk:'Copy a link to this view',
lab:'Lab: more tools',labp:'Extra tools for the curious. The lab uses the star that you loaded.',

epsindib:'Two brown dwarfs that SPHEREx sees as one dot. They move fast across the sky.',
wise0855:'A very cold and very faint neighbor of the Sun. Expect to see nothing in most colors. That is a result too.',
rwaur:'A young double star. It dims when dust passes in front. SPHEREx sees the two stars as one dot.',

loading:'Loading the pictures.',
loaded:(n,d,f,k,a)=>`${n} pictures over ${Math.round(d)} days. ${f} fair pairs exist. Noise check: the error in the files had to be multiplied by ${k.low.toFixed(2)} to ${k.high.toFixed(2)}. Each picture is held in place by about ${Math.round(a)} reference stars.`,

cap:(e)=>`Day ${e.day.toFixed(0)}, ${e.lam.toFixed(3)} micron, detector ${e.det}`,
c1a:'First picture, lined up with the second. ',c1b:'Now showing the second picture. ',c2:'Second picture. ',
fair:'Fair pair',unfair:'Not a fair pair',score:s=>`Score ${s} of 100`,
why:{det:'The two pictures come from different detectors. They show different colors. Do not compare them.',

rel:'The pictures come from different data releases. Brightness needs the flux correction first. Positions can still be compared.',

chip:{color:v=>v==null?'Color unknown':`Color match ${v} of a channel`,signal:v=>`Signal ${v}`,flags:v=>v?`Bad pixels in ${v}`:'Clean pixels',baseline:v=>`${v} days apart`,release:v=>v=='same'?'Same release':'Different release',anchors:v=>`${v} reference stars`},
dir:x=>x<0?'fainter':'brighter',
fc0:'The meter needs three or more clean colors on this detector. It cannot run here.',
fc:(p,m,real,fair)=>`Color alone makes the star look ${Math.abs(p).toFixed(1)} percent ${L.en.dir(p)}. `+(m==null?'':`The pictures show it ${Math.abs(m).toFixed(1)} percent ${L.en.dir(m)}. `+(real?'So a real change remains.':'So nothing real changed between these two pictures.'))+(fair?'':' An honest tool must not blink this pair without the warning.'),
fcl:['Color alone','Measured'],fcx:'Brightness change in percent. Left is fainter, right is brighter.',
wit:{ask:'Checking the other pictures.',sky:(s,n)=>`This spot is part of the sky. It appears again in ${s} of ${n} other pictures.`,single:n=>`This spot appears in this picture only, and in none of ${n} others. It is a camera glitch, a cosmic ray, or an object that moved away.`,mixed:(s,n)=>`This spot appears again in ${s} of ${n} other pictures. It is faint, or it shows in some colors only.`,none:'No other picture covers this place.'},
mo:{'Motion model preferred':'It moves.','Fixed position preferred':'It stays in place.','Inconclusive':'The data cannot decide.'},
mosay:(f,m)=>f.pm==null?(f.frames?'Too few pictures show the star for a motion measurement.':'The star was not seen in any picture. No motion can be measured. This is a nondetection.'):`Measured motion: ${f.pm.toFixed(2)} plus or minus ${f.err.toFixed(2)} arcseconds per year, from ${f.frames} pictures over ${Math.round(f.baseline_days)} days. `+(m.expected_arcsec_per_year>0.05?`The star catalog says ${m.expected_arcsec_per_year.toFixed(2)}. The difference is ${Math.abs(m.pull).toFixed(1)} times the error. `+(Math.abs(m.pull)<3?'The measurement passes this truth test.':'The measurement fails this truth test. Do not trust the motion.'):'The catalog says that this star does not move at this scale.')+(f.parallax!=null&&m.expected_parallax?` Yearly wobble from the orbit of the Earth (parallax): ${f.parallax.toFixed(2)} plus or minus ${f.parallax_err.toFixed(2)} arcseconds. The catalog says ${m.expected_parallax.toFixed(2)}.`:'')+(f.skipped?` ${f.skipped} pictures were left out: star too faint or bad pixels.`:''),
moax:['Days since the first picture','Shift on the sky (arcseconds)'],mok:['East','North'],
sp:{var:'The brightness changed.',flat:'The brightness did not change.',few:'Too few matched colors to decide.'},

copied:'Link copied.',err:'Something did not work: '
},bn:{
h1:'একই আকাশ। একই রঙ। তারপর তুলনা।',

aside:'যশোরে রাধাগোবিন্দ চন্দ্র খালি চোখে তারার বদল দেখতেন এবং হাজার হাজার পর্যবেক্ষণ সারা বিশ্বের জ্যোতির্বিদদের কাছে পাঠাতেন। CHRONOS সেই একই কাজ করে একটি মহাকাশ টেলিস্কোপ দিয়ে।',
