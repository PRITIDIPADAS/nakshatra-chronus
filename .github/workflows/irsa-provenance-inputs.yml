name: IRSA SPHEREx exact calibration provenance lookup

on:
  push:
    branches:
      - chronos-5-causal-sky-twin
    paths:
      - research_discovery/spherex/query_provenance_inputs.py
      - .github/workflows/irsa-provenance-inputs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronos-5-causal-sky-twin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IRSA query dependencies
        run: python -m pip install -r research_discovery/requirements-research.txt
      - name: Query the science artifact provenance chain
        run: |
          set -o pipefail
          python -m research_discovery.spherex.query_provenance_inputs 2>&1 | tee irsa-provenance-inputs.log
      - name: Upload exact provenance query and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irsa-spherex-provenance-inputs
          path: |
            data/irsa_provenance_inputs/
            irsa-provenance-inputs.log
          if-no-files-found: warn
          retention-days: 30
