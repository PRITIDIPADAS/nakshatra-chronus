name: SPHEREx held-out sky-aware noise test

on:
  push:
    branches: [main]
    paths:
      - "docs/PREREGISTRATION_SKY_AWARE_NOISE_2026-11-26.md"
      - ".github/workflows/spherex-holdout-sky-aware-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spherex-holdout-sky-aware
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r research_discovery/requirements-research.txt
      - name: Run the six held-out fields declared in the preregistration
        continue-on-error: true
        run: |
          python -m research_discovery.spherex.run_multifield_jy_pilot --field-set holdout \
            --out data/spherex_holdout --release dr1 --bandpass SPHEREx-D2 --code-revision ${{ github.sha }}
      - name: Print per-injection diagnostics
        if: always()
        run: |
          python -m research_discovery.spherex.summarize_injection_diagnostics \
            data/spherex_holdout --json data/spherex_holdout/injection_diagnostics.json
          for f in data/spherex_holdout/fields/*/runner.log; do echo "== $f"; tail -n 15 "$f"; done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spherex-holdout-sky-aware
          path: |
            data/spherex_holdout/multi_field_jy_pilot_summary.json
            data/spherex_holdout/injection_diagnostics.json
            data/spherex_holdout/fields/*/runner.log
          if-no-files-found: warn
          retention-days: 30
