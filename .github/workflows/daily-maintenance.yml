name: Daily repository maintenance

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run safe, non-executing checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import tokenize

          root = pathlib.Path(".")
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\0")
          tracked = [p for p in tracked if p]
          ignored = {".git", "node_modules", ".venv", "venv", "vendor", "dist", "build"}
          files = [
              pathlib.Path(p) for p in tracked
              if not any(part in ignored for part in pathlib.Path(p).parts)
          ]

          json_files = [p for p in files if p.suffix.lower() == ".json"]
          python_files = [p for p in files if p.suffix.lower() == ".py"]
          problems = []

          for path in json_files:
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      json.load(handle)
              except Exception as exc:
                  problems.append(f"- JSON `{path}`: {type(exc).__name__}: {exc}")

          for path in python_files:
              try:
                  with tokenize.open(path) as handle:
                      source = handle.read()
                  compile(source, str(path), "exec")
              except Exception as exc:
                  problems.append(f"- Python `{path}`: {type(exc).__name__}: {exc}")

          json_bad = any(x.startswith("- JSON ") for x in problems)
          python_bad = any(x.startswith("- Python ") for x in problems)
          summary = [
              "# Automated maintenance status",
              "",
              "This report is generated by the scheduled, non-destructive repository audit.",
              "",
              "## Checks",
              f"- Tracked files inspected: **{len(files)}**",
              f"- JSON syntax: **{'ATTENTION' if json_bad else 'PASS'}** ({len(json_files)} files)",
              f"- Python syntax: **{'ATTENTION' if python_bad else 'PASS'}** ({len(python_files)} files)",
              f"- Findings: **{len(problems)}**",
              "",
          ]
          if problems:
              summary += ["## Findings", "", *problems, ""]
          else:
              summary += ["No JSON or Python syntax issues were detected.", ""]
          summary += [
              "## Safety",
              "",
              "The audit parses JSON and compiles Python source without executing project code, installing dependencies, or changing application files.",
              "A commit is created only when this report changes.",
              "",
          ]

          report = root / ".github" / "maintenance" / "status.md"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text("\n".join(summary), encoding="utf-8")
          PY

      - name: Commit report only when it changes
        shell: bash
        run: |
          set -euo pipefail
          git add .github/maintenance/status.md
          if git diff --cached --quiet; then
            echo "Maintenance report is unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update maintenance status"
          git push
