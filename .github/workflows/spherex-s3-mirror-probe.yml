name: SPHEREx public S3 mirror calibration probe

on:
  push:
    branches:
      - chronos-5-causal-sky-twin
    paths:
      - research_discovery/spherex/probe_spherex_s3_mirror.py
      - .github/workflows/spherex-s3-mirror-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronos-5-causal-sky-twin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install requests
      - name: List exact public mirror prefixes
        run: |
          set -o pipefail
          python -m research_discovery.spherex.probe_spherex_s3_mirror 2>&1 | tee spherex-s3-mirror-probe.log
      - name: Upload bucket listing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spherex-public-s3-mirror-probe
          path: |
            data/spherex_s3_mirror_probe/
            spherex-s3-mirror-probe.log
          if-no-files-found: warn
          retention-days: 7
