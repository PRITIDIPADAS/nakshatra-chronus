name: IRSA SPHEREx calibration access probe

on:
  push:
    branches:
      - chronos-5-causal-sky-twin
    paths:
      - research_discovery/spherex/probe_irsa_calibration_access.py
      - .github/workflows/irsa-calibration-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronos-5-causal-sky-twin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IRSA query dependencies
        run: python -m pip install -r research_discovery/requirements-research.txt
      - name: Probe public DR1 calibration interfaces
        run: |
          set -o pipefail
          python -m research_discovery.spherex.probe_irsa_calibration_access 2>&1 | tee irsa-calibration-probe.log
      - name: Save probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irsa-calibration-access-probe
          path: |
            data/irsa_calibration_probe/
            irsa-calibration-probe.log
          if-no-files-found: warn
          retention-days: 7
